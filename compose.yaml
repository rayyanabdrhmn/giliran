services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: giliran
      POSTGRES_USER: giliran
      POSTGRES_PASSWORD: giliran_dev_only
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giliran -d giliran"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: